<!doctype html>
<!--
  The README's banner, rendered to banner.png at twice its size:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,568 \
      --default-background-color=00000000 --virtual-time-budget=10000 \
      --screenshot=banner.png banner.html

  The colours, type, and terminal are rentfree.dev's landing page, a little
  larger so they read at the README's width. The letters are the page's SVG
  of the CLI's `rf init` banner, packages/cli/src/banner.ts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>rentfree banner</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400&display=block"
    />
    <style>
      :root {
        --ink: #0b0c0f;
        --panel: #14161b;
        --line: #262a33;
        --text: #f2f4f8;
        --muted: #8d93a0;
        --face: #60a5fa;
        --deep: #2563eb;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1280px;
        height: 568px;
        background: transparent;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1280px;
        height: 568px;
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 70% at 50% 100%, rgba(37, 99, 235, 0.14), transparent 70%),
          var(--ink);
        color: var(--text);
        font-family: "Geist", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 76px;
        padding: 0 40px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 30px;
        height: 30px;
      }
      .what {
        color: var(--muted);
        font-size: 19px;
        letter-spacing: -0.01em;
      }
      .terminal {
        position: absolute;
        left: 50%;
        top: 128px;
        width: 1010px;
        transform: translateX(-50%);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        overflow: hidden;
      }
      .titleBar {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 46px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
      }
      .titleBar span {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .titleBar span:nth-child(2) {
        background: #febc2e;
      }
      .titleBar span:nth-child(3) {
        background: #28c840;
      }
      .screen {
        padding: 24px 32px 120px;
        font-family: var(--mono);
        font-size: 19px;
        line-height: 1.6;
      }
      .prompt,
      .slogan,
      .frameLabel {
        white-space: pre;
      }
      .prompt {
        color: var(--face);
      }
      .prompt::before {
        content: "$ ";
        color: var(--muted);
      }
      .frame {
        position: relative;
        margin: 18px 0 0;
        padding: 34px 40px 36px;
        border: 1px solid var(--deep);
        border-left-style: dashed;
        border-right-style: dashed;
        border-radius: 12px;
      }
      .art {
        display: block;
        width: 100%;
        height: auto;
      }
      .slogan {
        margin-top: 20px;
        color: var(--face);
      }
      .frameLabel {
        position: absolute;
        right: 30px;
        bottom: -0.75em;
        padding: 0 10px;
        background: var(--panel);
        color: var(--muted);
        font-size: 16px;
      }
    </style>
  </head>
